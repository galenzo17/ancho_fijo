# Publicación en Hex al empujar un tag `vX.Y.Z`.
#
# El tag es la orden de publicar; el workflow solo verifica que la orden sea
# coherente antes de obedecerla: que el tag diga lo mismo que `@version` en
# mix.exs, que el CHANGELOG tenga una sección para esa versión y que la tabla
# de SECURITY.md nombre la serie. Después corre
# la suite una vez más en la versión más nueva, arma el paquete y las docs
# como lo hace el job `paquete` de ci.yml, los verifica, y recién publica.
#
# La credencial es el secret HEX_API_KEY del repositorio, generada en
# https://hex.pm/dashboard/keys con permiso `api:write`. No hay otra copia.
name: Publicar en Hex

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Verificar que el tag coincide con mix.exs, el CHANGELOG y SECURITY.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's/^[[:space:]]*@version "([^"]+)"/\1/p' mix.exs)"
          if [ "$tag" != "$version" ]; then
            echo "::error file=mix.exs::El tag v$tag no coincide con @version \"$version\""
            exit 1
          fi
          if ! grep -qE "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No hay una sección ## [$version] en el CHANGELOG"
            exit 1
          fi
          serie="${version%.*}.x"
          if ! grep -qE "^\| *${serie//./\\.} *\|" SECURITY.md; then
            echo "::error file=SECURITY.md::La tabla de versiones con soporte no nombra la serie $serie"
            exit 1
          fi

      - name: Instalar Erlang y Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - run: mix deps.get

      - run: mix test
        env:
          MIX_ENV: test

      - run: mix compile --warnings-as-errors

      - run: mix docs --warnings-as-errors

      - run: mix hex.build

      - name: Verificar el tarball
        run: sh .github/scripts/verificar_paquete.sh

      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
