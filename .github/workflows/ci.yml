# Integración continua.
#
# Dos jobs con criterios distintos:
#
# - `pruebas` corre en toda la matriz de pares Elixir/OTP que el paquete declara
#   soportar (`elixir: "~> 1.14"` en mix.exs). Su pregunta es "¿compila y pasa
#   en cada versión?". Compila con warnings como errores en todas, porque cada
#   versión nueva de Elixir trae deprecaciones y es acá donde se ven primero.
#
# - `calidad` corre una sola vez, en la versión más nueva. Formato, credo,
#   dialyzer y cobertura no dependen de la versión del lenguaje; correrlos
#   cuatro veces sería cuatro veces el costo por la misma respuesta. Y el
#   dialyzer es el paso lento: su PLT se cachea aparte de deps/_build porque
#   cambia con otra frecuencia (OTP y mix.lock, no cada commit).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # El mínimo declarado. OTP 25 es el más nuevo que 1.14 soporta
          # oficialmente en toda la serie. Corre en 22.04 porque los builds
          # precompilados de OTP 25 existen para esa imagen.
          - elixir: "1.14.5"
            otp: "25.3"
            os: ubuntu-22.04
          - elixir: "1.16.3"
            otp: "26.2"
            os: ubuntu-24.04
          - elixir: "1.18.4"
            otp: "27.3"
            os: ubuntu-24.04
          # La más nueva. Es la única que mide cobertura: ver `calidad`.
          - elixir: "1.20"
            otp: "28"
            os: ubuntu-24.04
            cobertura: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Erlang y Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # La clave lleva las versiones exactas que setup-beam resolvió, no las de
      # la matriz: "1.20" puede resolver a 1.20.1 mañana y los .beam compilados
      # con 1.20.0 no sirven.
      - name: Cache de deps y _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ env.MIX_ENV }}-

      - run: mix deps.get

      # Las dependencias se compilan aparte para que --warnings-as-errors
      # aplique solo al código del paquete: un warning en credo no es nuestro.
      - run: mix deps.compile

      - run: mix compile --warnings-as-errors

      - name: Tests
        if: ${{ !matrix.cobertura }}
        run: mix test

      - name: Tests con cobertura
        if: ${{ matrix.cobertura }}
        run: mix test --cover

  calidad:
    name: Formato, credo y dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Erlang y Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      # Sin MIX_ENV fijo: `cli/0` en mix.exs elige test para credo y dev para
      # dialyzer, y _build guarda los dos.
      - name: Cache de deps y _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-calidad-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-calidad-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # El PLT se restaura y se guarda en pasos separados, con `if: always()`
      # en el guardado: si dialyzer encuentra un error después de construir el
      # PLT, el PLT igual se cachea y la corrida siguiente no vuelve a pagar
      # los minutos de construcción. Con actions/cache a secas, un job que
      # falla no guarda nada.
      - name: Restaurar el PLT de dialyzer
        id: plt
        uses: actions/cache/restore@v4
        with:
          path: priv/plts
          key: plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix credo --strict

      # Avisos de seguridad de las dependencias, incluidas las opcionales.
      - run: mix hex.audit

      - name: Construir el PLT si no vino del cache
        if: steps.plt.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Guardar el PLT de dialyzer
        if: always() && steps.plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: priv/plts
          key: ${{ steps.plt.outputs.cache-primary-key }}

      - run: mix dialyzer --format github

  prompts:
    name: Registro de prompts
    runs-on: ubuntu-24.04
    steps:
      # Historia completa: la verificación lee el commit que agregó cada archivo.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar Erlang y Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - name: Cache de deps y _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-prompts-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-prompts-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix prompts.verificar

  # Lo que ve un proyecto que agrega la librería: un `mix new` con
  # `{:ancho_fijo, path: ...}` y nada más, sin :telemetry ni :decimal. En el
  # repo las deps de dev y test tapan los warnings de xref y los atributos sin
  # usar de las ramas compiladas condicionalmente; acá no hay nada que los tape.
  dependencia:
    name: Como dependencia
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - elixir: "1.14.5"
            otp: "25.3"
          - elixir: "1.20"
            otp: "28"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ancho_fijo

      - name: Instalar Erlang y Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Crear un proyecto vacío que dependa de la librería por path
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix new consumidor
          cat > consumidor/mix.exs <<'MIX'
          defmodule Consumidor.MixProject do
            use Mix.Project

            def project do
              [app: :consumidor, version: "0.0.0", elixir: "~> 1.14", deps: deps()]
            end

            def application, do: [extra_applications: [:logger]]

            defp deps, do: [{:ancho_fijo, path: "../ancho_fijo"}]
          end
          MIX

      - name: Compilar la librería como dependencia sin un solo warning
        working-directory: consumidor
        run: |
          mix deps.get
          mix deps.compile 2>&1 | tee compilacion.log
          if grep -q "warning:" compilacion.log; then
            echo "::error::la librería compila con warnings como dependencia"
            exit 1
          fi

      - name: Usar la librería desde el proyecto vacío
        working-directory: consumidor
        run: |
          mix run -e '
          layout = [campos: [[nombre: :rut, largo: 10, tipo: :rut], [nombre: :monto, largo: 8, tipo: :decimal, precision: 2]]]
          {:ok, [registro], []} = AnchoFijo.parsear(layout, "12345678-500012345\n")
          {:ok, "12345678-500012345\n", []} = AnchoFijo.escribir(layout, [registro])
          {:ok, "sha256:" <> _} = AnchoFijo.huella("12345678-500012345\n")
          true = :crypto in Application.spec(:ancho_fijo, :applications)
          # Sin Decimal: como: :decimal es un layout inválido que lo dice, y un
          # string numérico no se puede escribir; la tupla y el entero sí.
          false = AnchoFijo.Tipo.Decimal.decimal_disponible?()
          false = AnchoFijo.Test.Generadores.disponible?()
          {:error, [%AnchoFijo.Diagnostico{tipo: :layout, campo: :monto} = d]} = AnchoFijo.Layout.nuevo(campos: [[nombre: :monto, largo: 8, tipo: :decimal, precision: 2, como: :decimal]])
          true = String.contains?(d.causa_probable, "agregue {:decimal")
          {:error, [%AnchoFijo.Diagnostico{campo: :monto} = d]} = AnchoFijo.escribir([campos: [[nombre: :monto, largo: 8, tipo: :decimal, precision: 2]]], [%{monto: "12.50"}])
          true = String.contains?(d.causa_probable, "Decimal, que no está disponible")
          {:ok, "00001200\n", []} = AnchoFijo.escribir([campos: [[nombre: :monto, largo: 8, tipo: :decimal, precision: 2]]], [%{monto: 12}])
          IO.puts("ancho_fijo " <> to_string(Application.spec(:ancho_fijo, :vsn)) <> " funciona como dependencia")
          '
